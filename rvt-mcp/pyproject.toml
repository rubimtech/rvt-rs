[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rvt-mcp"
version = "0.1.0"
description = "MCP server for reading Autodesk Revit files without Revit: metadata, elements, schedules, geometry and IFC/glTF/SVG export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["revit", "bim", "ifc", "gltf", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastmcp>=4.1,<5",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "rvt>=0.10,<0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
rvt-mcp = "rvt_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rvt_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:rvt_mcp.*"]
